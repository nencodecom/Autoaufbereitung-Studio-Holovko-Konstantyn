# Consent-Nachweis (Art. 7 Abs. 1 DSGVO): eine Zeile pro Einwilligungs-
# entscheidung. Bewusst OHNE IP-Adresse – die Zuordnung erfolgt über die
# Nachweis-ID, die auch im Browser des Besuchers gespeichert ist.
# Felder: Zeit | Nachweis-ID | Banner-Version | Zeitstempel (Client) | Weg | Auswahl | User-Agent
log_format consent '$time_iso8601 | $arg_id | $arg_v | $arg_ts | $arg_m | $arg_c | $http_user_agent';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Empfängt den Beacon aus consent.js, schreibt ins Consent-Log, kein Body.
    # Für dauerhafte Aufbewahrung /var/log/nginx als Volume mounten.
    location = /consent-log {
        access_log /var/log/nginx/consent.log consent;
        add_header Cache-Control "no-store";
        return 204;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|mp4|webp|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
